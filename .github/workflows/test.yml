name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hunch
          POSTGRES_PASSWORD: hunch
          POSTGRES_DB: hunch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Both point at the CI Postgres service. TEST_DATABASE_URL is what
      # un-skips tests/multitenancy.test.ts — the trust-boundary suite that
      # proves one workspace can't read another's data.
      DATABASE_URL: postgresql://hunch:hunch@localhost:5432/hunch_test
      TEST_DATABASE_URL: postgresql://hunch:hunch@localhost:5432/hunch_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply schema to test database
        # Throwaway CI database, so db push is fine here regardless of
        # whether migrations exist yet.
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
